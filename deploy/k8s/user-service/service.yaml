apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: seckill
  labels:
    service: user-service
spec:
  type: NodePort
  selector:
    service: user-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: grpc
      port: 50050
      targetPort: 50050
      protocol: TCP